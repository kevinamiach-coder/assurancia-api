<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssuranceIA™ - Water Damage Claims</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .claims-list {
            max-height: 600px;
            overflow-y: auto;
        }
        .claim-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .claim-item h3 {
            color: #667eea;
            margin-bottom: 8px;
        }
        .claim-item p {
            color: #666;
            font-size: 0.95em;
            margin: 5px 0;
        }
        .claim-item .claim-id {
            color: #999;
            font-size: 0.85em;
            margin-top: 8px;
        }
        .debug-section {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
        }
        .debug-section h3 {
            color: #856404;
            margin-bottom: 10px;
        }
        .debug-content {
            background: white;
            padding: 10px;
            border-radius: 4px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            color: #333;
        }
        .success {
            color: #28a745;
            font-weight: 600;
        }
        .error {
            color: #dc3545;
            font-weight: 600;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        .analysis-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .analysis-buttons button {
            padding: 8px 12px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 AssuranceIA™</h1>
            <p>Automated Water Damage Insurance Claims Validation</p>
        </div>

        <div class="content">
            <!-- Formulaire de création de claim -->
            <div class="card">
                <h2>Créer un Sinistre</h2>
                <form id="claimForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="vous@example.com">
                    </div>
                    <div class="form-group">
                        <label for="address">Adresse</label>
                        <input type="text" id="address" name="address" required placeholder="123 Rue de Paris, 75001">
                    </div>
                    <div class="form-group">
                        <label for="damageType">Type de Dégât</label>
                        <select id="damageType" name="damageType" required>
                            <option value="">-- Sélectionner --</option>
                            <option value="water_leak">Fuite d'eau</option>
                            <option value="flooding">Inondation</option>
                            <option value="pipe_burst">Tuyau éclaté</option>
                            <option value="roof_damage">Dégâts de toit</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" required placeholder="Décrivez les dégâts..."></textarea>
                    </div>
                    <button type="submit">✅ Créer le Sinistre</button>
                </form>

                <div class="debug-section">
                    <h3>🔧 Réponse API</h3>
                    <div class="debug-content" id="debugResponse">En attente...</div>
                </div>
            </div>

            <!-- Liste des claims -->
            <div class="card">
                <h2>Sinistres Reçus</h2>
                <div class="claims-list" id="claimsList">
                    <p style="color: #999;">Aucun sinistre pour le moment...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration API
        const API_URL = 'https://assurancia-api-2.onrender.com';

        // Élements du DOM
        const claimForm = document.getElementById('claimForm');
        const debugResponse = document.getElementById('debugResponse');
        const claimsList = document.getElementById('claimsList');

        // Soumettre un nouveau claim
        claimForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(claimForm);
            const claimData = {
                user_email: formData.get('email'),
                address: formData.get('address'),
                damage_type: formData.get('damageType'),
                description: formData.get('description')
            };

            try {
                debugResponse.innerHTML = '⏳ Envoi en cours...';

                const response = await fetch(`${API_URL}/claims`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(claimData)
                });

                const data = await response.json();

                if (response.ok) {
                    debugResponse.innerHTML = `<span class="success">✅ Sinistre créé avec succès!</span>\n\n${JSON.stringify(data, null, 2)}`;
                    claimForm.reset();
                    loadClaims();
                } else {
                    debugResponse.innerHTML = `<span class="error">❌ Erreur: ${data.detail || 'Erreur inconnue'}</span>\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                debugResponse.innerHTML = `<span class="error">❌ Erreur réseau: ${error.message}</span>`;
            }
        });

        // Charger les claims
        async function loadClaims() {
            try {
                const response = await fetch(`${API_URL}/claims`);
                const claims = await response.json();

                if (claims.length === 0) {
                    claimsList.innerHTML = '<p style="color: #999;">Aucun sinistre pour le moment...</p>';
                    return;
                }

                claimsList.innerHTML = claims.map(claim => `
                    <div class="claim-item">
                        <h3>📋 ${claim.damage_type || 'Sans type'}</h3>
                        <p><strong>Email:</strong> ${claim.user_email}</p>
                        <p><strong>Adresse:</strong> ${claim.address}</p>
                        <p><strong>Description:</strong> ${claim.description}</p>
                        <div class="analysis-buttons">
                            <button onclick="analyzeClaim('${claim.claim_id}')">🔍 Analyser</button>
                            <button onclick="uploadPhoto('${claim.claim_id}')" style="background: #17a2b8;">📸 Photo</button>
                        </div>
                        <div class="claim-id">ID: ${claim.claim_id}</div>
                    </div>
                `).join('');
            } catch (error) {
                claimsList.innerHTML = `<p class="error">Erreur lors du chargement: ${error.message}</p>`;
            }
        }

        // Analyser un claim
        async function analyzeClaim(claimId) {
            try {
                const response = await fetch(`${API_URL}/claims/${claimId}/analyze`, {
                    method: 'POST'
                });
                const data = await response.json();
                alert(`Analyse du sinistre ${claimId}:\n\n${JSON.stringify(data, null, 2)}`);
            } catch (error) {
                alert(`Erreur: ${error.message}`);
            }
        }

        // Upload une photo
        function uploadPhoto(claimId) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const formData = new FormData();
                formData.append('file', file);

                try {
                    const response = await fetch(`${API_URL}/claims/${claimId}/photos`, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    alert(`Photo ajoutée: ${data.filename}`);
                    loadClaims();
                } catch (error) {
                    alert(`Erreur upload: ${error.message}`);
                }
            };
            input.click();
        }

        // Charger les claims au démarrage
        loadClaims();
        setInterval(loadClaims, 5000); // Actualiser toutes les 5 secondes
    </script>
</body>
</html>
