<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssuranceIA™ - Validation Sinistres Dégâts des Eaux</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container { max-width: 1280px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 32px; }
        .header h1 { font-size: 2.5em; margin-bottom: 8px; }
        .header p { font-size: 1.1em; opacity: 0.92; }
        .stats { display: flex; gap: 16px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .stat-pill {
            background: rgba(255,255,255,0.18); color: white; padding: 10px 20px;
            border-radius: 30px; font-weight: 600; backdrop-filter: blur(4px);
        }
        .content { display: grid; grid-template-columns: 1fr 1.3fr; gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.18); }
        .card h2 { color: #667eea; margin-bottom: 16px; font-size: 1.4em; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 0.92em; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95em; font-family: inherit;
        }
        .form-group textarea { resize: vertical; min-height: 70px; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;
            padding: 11px 20px; border: none; border-radius: 6px; cursor: pointer;
            font-size: 0.95em; font-weight: 600; transition: transform 0.15s, box-shadow 0.15s;
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-full { width: 100%; }
        .claims-list { max-height: 720px; overflow-y: auto; }
        .claim-item {
            background: #f8f9fb; border-left: 4px solid #667eea; padding: 16px;
            margin-bottom: 14px; border-radius: 8px;
        }
        .claim-item h3 { color: #4a4a6a; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .claim-item p { color: #555; font-size: 0.9em; margin: 3px 0; }
        .claim-id { color: #999; font-size: 0.8em; margin-top: 6px; font-family: monospace; }
        .badge { display: inline-block; padding: 2px 9px; border-radius: 12px; font-size: 0.75em; font-weight: 700; color: white; }
        .sev-low { background: #28a745; } .sev-medium { background: #f0ad4e; }
        .sev-high { background: #e8590c; } .sev-critical { background: #dc3545; }
        .sev-unknown { background: #adb5bd; }
        .fraud-bar { height: 8px; border-radius: 4px; background: #e9ecef; margin: 4px 0 8px; overflow: hidden; }
        .fraud-fill { height: 100%; border-radius: 4px; }
        .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .actions button { flex: 1; padding: 8px; font-size: 0.85em; min-width: 90px; }
        .btn-teal { background: #17a2b8 !important; }
        .btn-green { background: #28a745 !important; }
        .btn-gray { background: #6c757d !important; }
        .analysis-box {
            background: #eef1ff; border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 0.88em;
        }
        .analysis-box .row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #dde3ff; }
        .analysis-box .row:last-child { border-bottom: none; }
        .analysis-box .label { color: #667; font-weight: 600; }
        #map { height: 280px; border-radius: 8px; margin-top: 8px; z-index: 1; }
        .debug-section { background: #fff8e6; border: 1px solid #ffe08a; padding: 12px; border-radius: 8px; margin-top: 16px; }
        .debug-section h3 { color: #856404; margin-bottom: 8px; font-size: 0.95em; }
        .debug-content {
            background: white; padding: 10px; border-radius: 6px; max-height: 200px; overflow-y: auto;
            font-family: monospace; font-size: 0.8em; white-space: pre-wrap; word-break: break-word;
        }
        .success { color: #28a745; font-weight: 600; }
        .error { color: #dc3545; font-weight: 600; }
        .empty { color: #999; text-align: center; padding: 20px; }
        @media (max-width: 900px) { .content { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 AssuranceIA™</h1>
            <p>Validation automatisée des sinistres dégâts des eaux par IA</p>
            <div class="stats">
                <div class="stat-pill" id="statTotal">0 sinistres</div>
                <div class="stat-pill" id="statAnalyzed">0 analysés</div>
                <div class="stat-pill" id="statFraud">0 alertes fraude</div>
            </div>
        </div>

        <div class="content">
            <!-- Colonne gauche : formulaire + carte -->
            <div>
                <div class="card">
                    <h2>Déclarer un Sinistre</h2>
                    <form id="claimForm">
                        <div class="form-group">
                            <label for="email">Email assuré</label>
                            <input type="email" id="email" required placeholder="vous@example.com">
                        </div>
                        <div class="form-group">
                            <label for="address">Adresse du sinistre</label>
                            <input type="text" id="address" required placeholder="12 Rue de Rivoli, 75001 Paris">
                        </div>
                        <div class="form-group">
                            <label for="damageType">Type de dégât</label>
                            <select id="damageType" required>
                                <option value="">-- Sélectionner --</option>
                                <option value="fuite">Fuite d'eau</option>
                                <option value="inondation">Inondation</option>
                                <option value="rupture_canalisation">Rupture de canalisation</option>
                                <option value="infiltration_toiture">Infiltration toiture</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" required placeholder="Décrivez les dégâts constatés..."></textarea>
                        </div>
                        <button type="submit" class="btn-full">✅ Créer le sinistre</button>
                    </form>
                    <div class="debug-section">
                        <h3>🔧 Réponse API</h3>
                        <div class="debug-content" id="debugResponse">En attente...</div>
                    </div>
                </div>

                <div class="card" style="margin-top:20px;">
                    <h2>🗺️ Localisation des sinistres</h2>
                    <div id="map"></div>
                </div>
            </div>

            <!-- Colonne droite : liste des sinistres -->
            <div class="card">
                <h2>Sinistres &amp; Analyses</h2>
                <div class="claims-list" id="claimsList">
                    <p class="empty">Aucun sinistre pour le moment...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Auto-detect API base: same origin in prod, fallback to Render URL when opened locally.
        const API_URL = (location.protocol === 'http:' || location.protocol === 'https:')
            ? (location.origin.includes('onrender.com') || location.port ? location.origin : 'https://assurancia-api-2.onrender.com')
            : 'https://assurancia-api-2.onrender.com';

        const claimForm = document.getElementById('claimForm');
        const debugResponse = document.getElementById('debugResponse');
        const claimsList = document.getElementById('claimsList');

        let map, markersLayer;
        function initMap() {
            map = L.map('map').setView([46.6, 2.4], 5); // Centre France
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap', maxZoom: 19
            }).addTo(map);
            markersLayer = L.layerGroup().addTo(map);
        }
        initMap();

        function severityBadge(sev) {
            const labels = { low: 'Faible', medium: 'Moyen', high: 'Élevé', critical: 'Critique' };
            const s = (sev || 'unknown');
            return `<span class="badge sev-${s}">${labels[s] || 'Inconnu'}</span>`;
        }

        function fraudColor(score) {
            if (score >= 70) return '#dc3545';
            if (score >= 40) return '#f0ad4e';
            return '#28a745';
        }

        function escapeHtml(t) {
            return String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
        }

        claimForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const claimData = {
                user_email: document.getElementById('email').value,
                address: document.getElementById('address').value,
                damage_type: document.getElementById('damageType').value,
                description: document.getElementById('description').value
            };
            try {
                debugResponse.textContent = '⏳ Création en cours (géocodage adresse)...';
                const res = await fetch(`${API_URL}/claims`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(claimData)
                });
                const data = await res.json();
                if (res.ok) {
                    debugResponse.innerHTML = `<span class="success">✅ Sinistre créé: ${data.claim_id}</span>\n` +
                        (data.location ? `📍 Géocodé: ${data.location.latitude.toFixed(4)}, ${data.location.longitude.toFixed(4)}` : '⚠️ Adresse non géolocalisée');
                    claimForm.reset();
                    loadClaims();
                } else {
                    debugResponse.innerHTML = `<span class="error">❌ ${data.detail || 'Erreur'}</span>\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (err) {
                debugResponse.innerHTML = `<span class="error">❌ Erreur réseau: ${err.message}</span>`;
            }
        });

        async function loadClaims() {
            try {
                const res = await fetch(`${API_URL}/claims`);
                const claims = await res.json();
                if (!Array.isArray(claims)) { return; }

                // Stats
                const analyzed = claims.filter(c => c.analysis).length;
                const frauds = claims.filter(c => c.analysis && (c.analysis.fraud_score || 0) >= 50).length;
                document.getElementById('statTotal').textContent = `${claims.length} sinistres`;
                document.getElementById('statAnalyzed').textContent = `${analyzed} analysés`;
                document.getElementById('statFraud').textContent = `${frauds} alertes fraude`;

                // Map markers
                markersLayer.clearLayers();
                const pts = [];
                claims.forEach(c => {
                    if (c.location && c.location.latitude) {
                        const m = L.marker([c.location.latitude, c.location.longitude])
                            .bindPopup(`<b>${escapeHtml(c.claim_id)}</b><br>${escapeHtml(c.damage_type)}<br>${escapeHtml(c.address)}`);
                        markersLayer.addLayer(m);
                        pts.push([c.location.latitude, c.location.longitude]);
                    }
                });
                if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 13 });

                if (claims.length === 0) {
                    claimsList.innerHTML = '<p class="empty">Aucun sinistre pour le moment...</p>';
                    return;
                }

                claimsList.innerHTML = claims.map(c => {
                    const a = c.analysis;
                    let analysisHtml = '';
                    if (a) {
                        const score = a.fraud_score || 0;
                        const cost = a.estimated_cost_eur ?? a.estimated_cost ?? '-';
                        let locVerif = '';
                        if (a.location_verification) {
                            const lv = a.location_verification;
                            const status = lv.matches ? '✅ Match' : '⚠️ Désaccord';
                            const dist = lv.distance_km !== null ? ` (${lv.distance_km}km)` : '';
                            locVerif = `<div class="row"><span class="label">Géoloc EXIF</span><span>${status}${dist}</span></div>`;
                        }
                        analysisHtml = `
                            <div class="analysis-box">
                                <div class="row"><span class="label">Type détecté</span><span>${escapeHtml(a.detected_damage_type || '-')}</span></div>
                                <div class="row"><span class="label">Gravité</span><span>${severityBadge(a.damage_severity)}</span></div>
                                <div class="row"><span class="label">Coût estimé</span><span>${escapeHtml(cost)} €</span></div>
                                <div class="row"><span class="label">Localisation fuite</span><span>${escapeHtml(a.leak_location || '-')}</span></div>
                                ${locVerif}
                                <div class="row" style="border:none;"><span class="label">Score fraude</span><span><b>${score}/100</b></span></div>
                                <div class="fraud-bar"><div class="fraud-fill" style="width:${score}%; background:${fraudColor(score)};"></div></div>
                                <div class="row"><span class="label">Cohérence</span><span>${escapeHtml(a.consistency_with_declaration || '-')}</span></div>
                                <div class="row"><span class="label">Recommandation</span></div>
                                <div style="font-size:0.85em; color:#555;">${escapeHtml(a.recommendation || '-')}</div>
                            </div>`;
                    }
                    return `
                        <div class="claim-item">
                            <h3>📋 ${escapeHtml(c.damage_type || 'Sans type')} ${a ? severityBadge(a.damage_severity) : ''}</h3>
                            <p><strong>Assuré:</strong> ${escapeHtml(c.user_email)}</p>
                            <p><strong>Adresse:</strong> ${escapeHtml(c.address)}</p>
                            <p><strong>Description:</strong> ${escapeHtml(c.description)}</p>
                            <p style="font-size:0.82em;color:#999;">📷 ${c.photo_count || 0} photo(s)${c.location ? ' · 📍 géolocalisé' : ''}</p>
                            ${analysisHtml}
                            <div class="actions">
                                <button class="btn-teal" onclick="uploadPhoto('${c.claim_id}')">📸 Photo</button>
                                <button onclick="analyzeClaim('${c.claim_id}', this)">🔍 Analyser</button>
                                <button class="btn-green" onclick="downloadReport('${c.claim_id}')">📄 PDF</button>
                            </div>
                            <div class="claim-id">ID: ${escapeHtml(c.claim_id)}</div>
                        </div>`;
                }).join('');
            } catch (err) {
                claimsList.innerHTML = `<p class="error">Erreur de chargement: ${err.message}</p>`;
            }
        }

        async function analyzeClaim(claimId, btn) {
            const original = btn.textContent;
            btn.disabled = true; btn.textContent = '⏳ Analyse...';
            try {
                const res = await fetch(`${API_URL}/claims/${claimId}/analyze`, { method: 'POST' });
                const data = await res.json();
                if (!res.ok) { alert(`Erreur: ${data.detail || 'inconnue'}`); }
                else if (data.recommendation && data.damage_severity === 'unknown' && !data.detected_damage_type) {
                    alert(data.recommendation);
                }
                await loadClaims();
            } catch (err) {
                alert(`Erreur: ${err.message}`);
            } finally {
                btn.disabled = false; btn.textContent = original;
            }
        }

        function uploadPhoto(claimId) {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/jpeg,image/png,image/gif,image/webp';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const fd = new FormData();
                fd.append('file', file);
                try {
                    const res = await fetch(`${API_URL}/claims/${claimId}/photos`, { method: 'POST', body: fd });
                    const data = await res.json();
                    if (!res.ok) alert(`Erreur upload: ${data.detail || 'inconnue'}`);
                    else loadClaims();
                } catch (err) { alert(`Erreur upload: ${err.message}`); }
            };
            input.click();
        }

        function downloadReport(claimId) {
            window.open(`${API_URL}/claims/${claimId}/report`, '_blank');
        }

        loadClaims();
        setInterval(loadClaims, 8000);
    </script>
</body>
</html>
